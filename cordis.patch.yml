# ============================================================================
# dsh-pet-plus 的 bundle patch —— 把「桌宠增强」挂进 DSH 配置树。
#
# 只有一行：宿主半侧插件（路由 + 命令）。浏览器半侧由 package.json 的
# dsh.client 声明，DSH 模块系统自动扫描并提供 /plugins/dsh-pet-plus/client.js。
#
# 配置不写在这里：所有用户设置都在 $DSH_HOME/dsh-pet-plus/config.json，
# 由「设置 → 插件 → 桌宠增强」页面读写，改完即时生效，不用重启。
# ============================================================================

- insert:
    - id: dsh-pet-plus
      name: 'dsh-pet-plus'
